<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Private site: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#fff6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12060b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>For You, My Love</title>
    <!-- Apply saved theme before paint to avoid a light/dark flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bd-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
