# Netlify settings for the frontend.
# In Netlify: Base directory = frontend  (it then finds this file automatically)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # 👇 your Railway backend address (no slash at the end) — guest video uploads go straight there
  VITE_DIRECT_API = "https://YOUR-BACKEND.up.railway.app"

# Every /api request is passed to Railway behind the scenes.
# To the browser it looks like ONE website, so her login cookie just works.
# 👇 put the same Railway address here too
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.up.railway.app/api/:splat"
  status = 200
  force = true

# React handles every page (/, /wish, …)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"